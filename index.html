<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080c14">
<title>底栏测试 02</title>
<style>
:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --inset-top: var(--safe-top);
  --inset-bottom: var(--safe-bottom);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { background: #080c14; color: #eef3ff; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
button, select, input { font: inherit; }
button, select { min-height: 44px; color: inherit; background: #182235; border: 1px solid #43516c; border-radius: 9px; padding: 8px 10px; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #6bbcff; outline-offset: 3px; }
.app { display: flex; flex-direction: column; position: relative; width: 100%; height: 100%; }
.top { position: fixed; z-index: 2; top: 0; left: 0; right: 0; height: calc(56px + var(--inset-top)); padding: var(--inset-top) 16px 0; display: flex; align-items: center; justify-content: space-between; background: #101b2c; border-bottom: 2px solid #6bbcff; }
.top strong { font-size: 16px; }
.top span { color: #b0c5e3; font-size: 12px; }
.main { position: absolute; inset: calc(56px + var(--inset-top)) 0 calc(64px + var(--inset-bottom)); padding: 12px 16px; overflow: auto; display: grid; align-items: center; }
.panel { width: 100%; max-width: 380px; margin: auto; }
.hint { margin: 0 0 14px; color: #b0c0d9; font-size: 13px; }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.controls label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #b0c0d9; }
.controls select { width: 100%; font-size: 16px; }
.safe-toggle { display: flex; align-items: center; gap: 8px; min-height: 44px; margin: 4px 0; }
.safe-toggle input { width: 20px; height: 20px; margin: 0; accent-color: #6bbcff; }
dl { margin: 0 0 12px; padding: 8px 12px; border: 1px solid #34425b; border-radius: 10px; background: #0f1726; font-size: 12px; }
dl > div { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
dt { color: #b0c0d9; }
dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
#copy { width: 100%; }
#applied { margin: 0 0 10px; padding: 7px 10px; border: 1px solid #3c896e; border-radius: 8px; background: #102b25; color: #a5f5d7; font-size: 12px; }
#applied[data-supported="false"] { border-color: #b68b42; color: #ffe0a8; background: #332817; }
#status { min-height: 20px; margin: 4px 0 0; color: #99dfc1; font-size: 12px; text-align: center; }
.bottom { position: fixed; z-index: 2; left: 0; right: 0; bottom: 0; height: calc(64px + var(--inset-bottom)); flex-shrink: 0; padding: 8px 16px calc(8px + var(--inset-bottom)); display: flex; flex-direction: column; align-items: center; justify-content: center; background: #143c68; }
.bottom strong { font-size: 16px; }
.bottom span { color: #c5e0ff; font-size: 12px; }
.bottom::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #43edb1; }
.app[data-layout="flex"] .top, .app[data-layout="flex"] .bottom { position: relative; flex-shrink: 0; }
.app[data-layout="flex"] .main { position: relative; inset: auto; flex: 1; min-height: 0; padding: 12px 16px; }
.safe-probe { position: absolute; width: 0; height: 0; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); visibility: hidden; pointer-events: none; }
</style>
</head>
<body>
<div class="app" id="app" data-layout="fixed">
  <header class="top"><strong>底栏测试 · 02</strong><span id="change-count">尚未切换</span></header>
  <main class="main">
    <div class="panel">
      <p class="hint">看底部绿色线与屏幕底边的距离。分别从 Safari 和主屏快捷方式打开对比。</p>
      <div class="controls">
        <label>底栏定位<select id="layout"><option value="fixed">固定贴底</option><option value="flex">页面内排列</option></select></label>
        <label>页面高度<select id="height"><option value="percent">100%</option><option value="dynamic">100dvh</option></select></label>
      </div>
      <label class="safe-toggle"><input type="checkbox" id="safe" checked>保留系统安全区</label>
      <p id="applied" role="status" aria-live="polite">正在读取…</p>
      <dl aria-label="当前设备布局数据">
        <div><dt>启动方式</dt><dd id="mode">—</dd></div>
        <div><dt>屏幕 / 页面 / 可视高度</dt><dd id="heights">—</dd></div>
        <div><dt>页面 / 底栏底边</dt><dd id="bottoms">—</dd></div>
        <div><dt>CSS 实际页面高度</dt><dd id="computed-height">—</dd></div>
        <div><dt>系统安全区：上 / 下</dt><dd id="insets">—</dd></div>
        <div><dt>可视顶偏移 / 缩放</dt><dd id="offset">—</dd></div>
      </dl>
      <button id="copy" type="button">复制诊断数据</button>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </main>
  <footer class="bottom" id="bottom"><strong id="bottom-label">底部栏 · 100%</strong><span>绿色线 = 网页底部边界</span></footer>
</div>
<div class="safe-probe" id="probe" aria-hidden="true"></div>
<script>
const app = document.getElementById('app');
const bottom = document.getElementById('bottom');
const layout = document.getElementById('layout');
const height = document.getElementById('height');
const safe = document.getElementById('safe');
const rounded = n => Number.isFinite(n) ? Math.round(n * 10) / 10 : null;
const show = (id, text) => { document.getElementById(id).textContent = text; };
let latest;
let changeCount = 0;
function measure() {
  const vv = window.visualViewport;
  const probe = getComputedStyle(document.getElementById('probe'));
  const appBox = app.getBoundingClientRect();
  const navBox = bottom.getBoundingClientRect();
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  const requestedHeight = height.value === 'dynamic' ? '100dvh' : '100%';
  const heightSupported = CSS.supports('height', requestedHeight);
  latest = {
    test: 'bar-test-02', time: new Date().toISOString(), url: location.href,
    userAgent: navigator.userAgent,
    mode: standalone ? 'standalone' : matchMedia('(display-mode: fullscreen)').matches ? 'fullscreen' : 'browser',
    navigatorStandalone: navigator.standalone ?? null,
    options: { layout: layout.value, height: height.value, safeArea: safe.checked },
    applied: { changes: changeCount, requestedHeight, inlineHeight: app.style.height || '100% (stylesheet)', computedHeight: getComputedStyle(app).height, heightSupported },
    screen: { width: screen.width, height: screen.height, availableHeight: screen.availHeight, dpr: devicePixelRatio },
    inner: { width: innerWidth, height: innerHeight },
    visualViewport: vv ? { width: rounded(vv.width), height: rounded(vv.height), offsetTop: rounded(vv.offsetTop), offsetLeft: rounded(vv.offsetLeft), scale: rounded(vv.scale) } : null,
    safeArea: { top: parseFloat(probe.paddingTop) || 0, bottom: parseFloat(probe.paddingBottom) || 0 },
    htmlHeight: rounded(document.documentElement.getBoundingClientRect().height),
    app: { top: rounded(appBox.top), height: rounded(appBox.height), bottom: rounded(appBox.bottom) },
    bottomBar: { top: rounded(navBox.top), height: rounded(navBox.height), bottom: rounded(navBox.bottom) }
  };
  show('mode', latest.mode === 'standalone' ? '主屏独立运行' : latest.mode === 'fullscreen' ? '全屏运行' : '浏览器内运行');
  show('heights', `${screen.height} / ${innerHeight} / ${vv ? rounded(vv.height) : '—'}`);
  show('bottoms', `${latest.app.bottom} / ${latest.bottomBar.bottom}`);
  show('computed-height', latest.applied.computedHeight);
  show('insets', `${latest.safeArea.top} / ${latest.safeArea.bottom}`);
  show('offset', `${vv ? rounded(vv.offsetTop) : '—'} / ${vv ? rounded(vv.scale) : '—'}`);
  show('change-count', changeCount ? `已切换 ${changeCount} 次` : '尚未切换');
  show('applied', heightSupported ? `已应用：${requestedHeight} · ${layout.value === 'fixed' ? '固定贴底' : '页面内排列'} · 安全区${safe.checked ? '开' : '关'}` : `当前浏览器不支持 ${requestedHeight}，此选项未生效`);
  document.getElementById('applied').dataset.supported = String(heightSupported);
  show('bottom-label', heightSupported ? `底部栏 · ${requestedHeight}` : '底部栏 · 高度选项未生效');
}
function applyOptions() {
  changeCount++;
  app.dataset.layout = layout.value;
  app.style.height = height.value === 'dynamic' ? '100dvh' : '100%';
  document.documentElement.style.setProperty('--inset-top', safe.checked ? 'var(--safe-top)' : '0px');
  document.documentElement.style.setProperty('--inset-bottom', safe.checked ? 'var(--safe-bottom)' : '0px');
  requestAnimationFrame(measure);
}
for (const control of [layout, height, safe]) control.addEventListener('change', applyOptions);
for (const event of ['resize', 'orientationchange', 'pageshow']) window.addEventListener(event, () => requestAnimationFrame(measure));
window.visualViewport?.addEventListener('resize', () => requestAnimationFrame(measure));
window.visualViewport?.addEventListener('scroll', () => requestAnimationFrame(measure));
document.addEventListener('visibilitychange', () => { if (!document.hidden) measure(); });
document.getElementById('copy').addEventListener('click', async () => {
  measure();
  const text = JSON.stringify(latest, null, 2);
  try {
    if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
    else throw new Error('Clipboard API unavailable');
    show('status', '已复制，可直接发给我');
  } catch {
    const area = document.createElement('textarea');
    area.value = text; area.setAttribute('aria-label', '诊断数据');
    area.style.cssText = 'position:fixed;inset:15% 6%;width:88%;height:65%;z-index:10;font-size:16px;';
    document.body.append(area); area.focus(); area.select();
    let copied = false;
    try { copied = document.execCommand('copy'); } catch {}
    if (copied) { area.remove(); show('status', '已复制，可直接发给我'); }
    else { show('status', '请长按选中的数据复制；点输入框外关闭'); area.addEventListener('blur', () => area.remove(), { once: true }); }
  }
});
measure();
</script>
</body>
</html>
